<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Historias de Usuario</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Gestor de Historias de Usuario</h1>
        
        <div class="forms-container">
            <form id="form-sprint">
                <h2>Crear Sprint</h2>
                <input type="text" id="sprint-nombre" placeholder="Nombre del Sprint" required>
                <input type="date" id="sprint-inicio" required>
                <input type="date" id="sprint-fin" required>
                <button type="submit">Guardar Sprint</button>
            </form>

            <form id="form-historia">
                <h2>Crear Historia de Usuario</h2>
                <input type="text" id="historia-titulo" placeholder="Título" required>
                <textarea id="historia-descripcion" placeholder="Descripción" required></textarea>
                <input type="text" id="historia-responsable" placeholder="Responsable" required>
                <input type="number" id="historia-puntos" placeholder="Puntos de complejidad" required>
                <select id="historia-sprint" required></select>
                <input type="date" id="historia-creacion" required>
                <button type="submit">Guardar Historia</button>
            </form>
        </div>

        <div class="acciones">
            <button id="btn-informe">Generar Informe</button>
        </div>
        <div id="informe-container"></div>

        <div id="historias-container"></div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
